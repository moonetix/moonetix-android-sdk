name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sdk:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew :offerwall:testDebugUnitTest :offerwall:lintRelease
      - name: Keep the lint and test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: offerwall/build/reports/
          if-no-files-found: ignore
