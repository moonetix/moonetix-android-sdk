name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sdk:
    name: Unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew :offerwall:testDebugUnitTest :offerwall:lintRelease
      - name: Keep the lint and test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: offerwall/build/reports/
          if-no-files-found: ignore
