version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    groups:
      android-gradle-plugin:
        patterns:
          - "com.android.*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: gradle/actions/setup-gradle
        update-types:
          - version-update:semver-major
