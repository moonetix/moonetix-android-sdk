version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: com.android.application
        update-types:
          - version-update:semver-major
      - dependency-name: com.android.library
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: gradle/actions
        update-types:
          - version-update:semver-major
